  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTVVI PINBALL</title>
  <meta name="description" content="캐릭터 핀볼로 즐기는 랜덤 추첨 게임">
  <meta name="theme-color" content="#09071b">
  <link rel="icon" type="image/png" href="/htvvi-01.cc827f78.png">
  <link rel="stylesheet" href="/roulette-main.72fc1a99.css">
</head>
<body>
<script type="module" src="/roulette-main.34df32e0.js"></script>
<script>function getNames() {
    const value = document.querySelector('#in_names').value.trim();
    return value.split(/[,\r\n]/g).map((v)=>v.trim()).filter(Boolean);
}
function renderRankPreview(marbleList) {
    const listEl = document.querySelector('#rankList');
    const countEl = document.querySelector('#rankCount');
    countEl.textContent = `${marbleList.length} PLAYERS`;
    listEl.innerHTML = '';
    marbleList.forEach((marble, i)=>{
        const item = document.createElement('div');
        item.className = 'rank-item';
        item.style.color = `hsl(${marble.hue} 65% 32%)`;
        const rank = document.createElement('span');
        rank.className = 'rank-num';
        rank.textContent = `${i + 1}`;
        const nameEl = document.createElement('span');
        nameEl.className = 'rank-name';
        nameEl.textContent = marble.name;
        item.append(rank, nameEl);
        listEl.append(item);
    });
}
function getLiveOrder() {
    const r = window.roulette;
    if (!r || !r._marbles) return [];
    return [...(r._winners || []), ...r._marbles];
}
let rankLoopId = null;
function startLiveRanking() {
    stopLiveRanking();
    rankLoopId = setInterval(()=>renderRankPreview(getLiveOrder()), 120);
}
function stopLiveRanking() {
    if (rankLoopId) {
        clearInterval(rankLoopId);
        rankLoopId = null;
    }
}
function getReady() {
    const names = getNames();
    window.roulette.setMarbles(names);
    ready = names.length > 0;
    localStorage.setItem('htvvi_names', names.join(','));
    document.querySelector('#btnStart').disabled = !ready;
    document.querySelector('#playerCount').textContent = `${names.length}\u{BA85}`;
    renderRankPreview(getLiveOrder());
    applyWinnerSetting();
}
function applyWinnerSetting() {
    const rankInput = document.querySelector('#in_winningRank');
    const chk = document.querySelector('#chkWinnerType');
    let start;
    let end;
    if (winnerType === 'first') {
        start = end = 1;
        chk.checked = false;
    } else if (winnerType === 'last') {
        start = end = window.roulette.getCount();
        chk.checked = true;
    } else start = end = parseInt(rankInput.value, 10) || 1;
    window.roulette.setWinnerRange(start - 1, end - 1);
    const clipped = window.roulette.getWinnerRange();
    rankInput.value = clipped.start + 1;
    rankInput.classList.toggle('active', winnerType === 'custom');
    document.querySelector('#winnerLabelFirst').classList.toggle('on', winnerType === 'first');
    document.querySelector('#winnerLabelLast').classList.toggle('on', winnerType === 'last');
}
function selectWinnerType(type) {
    winnerType = type;
    applyWinnerSetting();
}
let ready = false;
let winnerType = 'last';
let timerInterval = null;
function formatTime(totalSeconds) {
    const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
    const s = (totalSeconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}
function getCanvasRect() {
    const canvas = document.querySelector('canvas');
    return canvas ? canvas.getBoundingClientRect() : null;
}
function positionBigTimer() {
    const rect = getCanvasRect();
    const el = document.querySelector('#bigTimer');
    if (!rect || !el) return;
    // 결과 텍스트(당첨자 이름)와 겹치지 않도록 충분히 아래쪽으로 내려서 배치한다
    const top = Math.min(rect.top + rect.height / 2 + 260, rect.bottom - 60);
    el.style.top = `${top}px`;
    el.style.left = `${rect.left + rect.width / 2}px`;
}
function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    document.querySelector('#timerLabel').textContent = '타이머';
    document.querySelector('#btnTimer').classList.remove('active-timer');
    document.querySelector('#bigTimer').classList.remove('show');
}
function startTimer() {
    stopTimer();
    let remaining = 60;
    positionBigTimer();
    const bigValue = document.querySelector('#bigTimerValue');
    const bigTimer = document.querySelector('#bigTimer');
    bigValue.textContent = formatTime(remaining);
    bigTimer.classList.add('show');
    document.querySelector('#btnTimer').classList.add('active-timer');
    document.querySelector('#timerLabel').textContent = '중지';
    timerInterval = setInterval(()=>{
        remaining -= 1;
        if (remaining <= 0) {
            bigValue.textContent = '00:00';
            clearInterval(timerInterval);
            timerInterval = null;
            document.querySelector('#btnTimer').classList.remove('active-timer');
            document.querySelector('#timerLabel').textContent = '타이머';
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = '1분 타이머 종료';
            document.body.appendChild(toast);
            setTimeout(()=>toast.remove(), 1400);
            setTimeout(()=>bigTimer.classList.remove('show'), 1200);
            return;
        }
        bigValue.textContent = formatTime(remaining);
    }, 1000);
}
window.addEventListener('resize', ()=>{
    if (document.querySelector('#bigTimer').classList.contains('show')) positionBigTimer();
});
document.addEventListener('DOMContentLoaded', initialize);
function initialize() {
    if (!window.roulette || !window.roulette.isReady) {
        setTimeout(initialize, 100);
        return;
    }
    const params = new URLSearchParams(location.search);
    const saved = params.get('names')?.replace(/,/g, '\n') || localStorage.getItem('htvvi_names');
    if (saved) document.querySelector('#in_names').value = saved;
    window.roulette.setTheme('light');
    document.documentElement.classList.add('light');
    document.querySelector('#in_names').addEventListener('input', getReady);
    document.querySelector('#btnShuffle').addEventListener('click', getReady);
    document.querySelector('#btnStart').addEventListener('click', ()=>{
        if (!ready) return;
        document.querySelector('#settings').classList.add('hide');
        document.querySelector('#resultOverlay').classList.remove('show');
        stopTimer();
        startLiveRanking();
        window.roulette.start();
    });
    document.querySelector('#btnReplay').addEventListener('click', ()=>{
        document.querySelector('#resultOverlay').classList.remove('show');
        stopTimer();
        getReady();
        document.querySelector('#settings').classList.remove('hide');
    });
    document.querySelector('#btnTimer').addEventListener('click', ()=>{
        if (timerInterval) stopTimer();
        else startTimer();
    });
    document.querySelector('#chkSkill').addEventListener('change', (e)=>{
        window.options.useSkills = e.target.checked;
    });
    document.querySelector('#in_winningRank').addEventListener('change', ()=>selectWinnerType('custom'));
    document.querySelector('#chkWinnerType').addEventListener('change', (e)=>selectWinnerType(e.target.checked ? 'last' : 'first'));
    window.roulette.addEventListener('goal', (e)=>{
        ready = false;
        stopTimer();
        stopLiveRanking();
        renderRankPreview(getLiveOrder());
        setTimeout(()=>{
            const winnerNames = e.detail?.winners?.length ? e.detail.winners.join(', ') : e.detail?.winner ?? '';
            document.querySelector('#resultWinnerName').textContent = winnerNames;
            document.querySelector('#resultOverlay').classList.add('show');
        }, 3000);
    });
    window.roulette.addEventListener('message', (e)=>{
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = e.detail;
        document.body.appendChild(toast);
        setTimeout(()=>toast.remove(), 1400);
    });
    const mapSelector = document.querySelector('#sltMap');
    window.roulette.getMaps().forEach((map)=>{
        const option = document.createElement('option');
        option.value = map.index;
        option.textContent = map.title;
        mapSelector.append(option);
    });
    mapSelector.addEventListener('change', (e)=>{
        window.roulette.setMap(e.target.value);
        getReady();
    });
    getReady();
}

</script>

<header class="brand" aria-label="HTVVI PINBALL">
  <strong>HTVVI <em>PINBALL</em></strong>
</header>

<main id="settings" class="settings">
  <div class="combo-panel">
    <section id="playersPanel" class="left">
      <div class="section-title">
        <span>PLAYER</span>
        <small>쉼표 또는 줄바꿈으로 구분</small>
        <strong id="playerCount">0명</strong>
      </div>
      <textarea id="in_names" aria-label="참가자 이름">1번 선수,2번 선수,3번 선수,4번 선수,5번 선수,6번 선수,7번 선수</textarea>
    </section>

    <section class="right">
      <div class="collapsible-rows">
        <div class="row">
          <label for="sltMap">맵</label>
          <select id="sltMap"></select>
        </div>
        <div class="row row-split">
          <div class="split-col">
            <label>당첨</label>
            <div class="winner-toggle-group">
              <span class="toggle-side" id="winnerLabelFirst">1등</span>
              <input type="checkbox" id="chkWinnerType" checked>
              <span class="toggle-side on" id="winnerLabelLast">마지막</span>
              <input type="number" id="in_winningRank" value="1" min="1" aria-label="직접 순위 입력">
            </div>
          </div>
          <div class="split-col skill-col">
            <label for="chkSkill">스킬</label>
            <input type="checkbox" id="chkSkill" checked="">
          </div>
        </div>
        <div class="actions">
          <button id="btnShuffle" class="button ghost" aria-label="다시 섞기"><i class="icon shuffle"></i></button>
          <button id="btnStart" class="button primary"><i class="icon play"></i><span>시작</span></button>
        </div>
      </div>
    </section>
  </div>
</main>

<section id="rankPreview" class="ranklist">
  <div class="ranklist-header">
    <span>실시간 순위</span>
    <strong id="rankCount">0 PLAYERS</strong>
  </div>
  <div class="ranklist-body" id="rankList"></div>
</section>

<div id="resultOverlay" class="result-overlay">
  <div id="resultPopup" class="result-popup">
    <span class="result-popup-label">오늘의 당첨자는</span>
    <strong id="resultWinnerName" class="result-popup-name">-</strong>
  </div>
  <div id="resultActions" class="result-actions">
    <button id="btnReplay" class="button ghost" aria-label="다시하기"><i class="icon refresh"></i></button>
    <button id="btnTimer" class="button ghost" aria-label="1분 타이머"><span id="timerLabel">타이머</span></button>
  </div>
</div>

<div id="bigTimer" class="big-timer">
  <div class="big-timer-label">TIMER</div>
  <div class="big-timer-value" id="bigTimerValue">01:00</div>
</div>

</body></html>
